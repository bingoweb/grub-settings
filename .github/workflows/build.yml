name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    name: Create Release with Notes
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for generating changelog
      
      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT
      
      - name: Generate release notes
        id: notes
        run: |
          TAG_NAME="${{ steps.version.outputs.TAG_NAME }}"
          PREV_TAG="${{ steps.prev_tag.outputs.PREV_TAG }}"
          
          # Create release notes file
          cat > release_notes.md << 'HEADER'
          # GRUB Settings ${{ steps.version.outputs.TAG_NAME }} 🎉
          
          ## 📦 Installation
          
          | Distribution | Command |
          |--------------|---------|
          | **Debian/Ubuntu** | `sudo apt install ./grub-settings_*.deb` |
          | **Fedora/RHEL** | `sudo dnf install ./grub-settings-*.rpm` |
          | **Arch Linux** | `sudo pacman -U ./grub-settings-*-arch.pkg.tar.zst` |
          
          ## 📋 What's Changed
          
          HEADER
          
          if [ -n "$PREV_TAG" ]; then
            echo "Changes since $PREV_TAG:" >> release_notes.md
            echo "" >> release_notes.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s" >> release_notes.md
          else
            echo "Initial release" >> release_notes.md
          fi
          
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "**Full Changelog**: https://github.com/bingoweb/grub-settings/compare/${PREV_TAG}...${TAG_NAME}" >> release_notes.md
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: GRUB Settings ${{ steps.version.outputs.TAG_NAME }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.TAG_NAME, 'beta') || contains(steps.version.outputs.TAG_NAME, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-deb:
    name: Build Debian/Ubuntu Package
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION=${VERSION%-*}  # Remove -beta suffix if present
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Create package structure
        run: |
          mkdir -p packaging/deb/DEBIAN
          mkdir -p packaging/deb/usr/bin
          mkdir -p packaging/deb/usr/share/grub-settings
          mkdir -p packaging/deb/usr/share/applications
          mkdir -p packaging/deb/usr/share/metainfo
          mkdir -p packaging/deb/usr/share/icons/hicolor/256x256/apps
      
      - name: Create control file
        run: |
          cat > packaging/deb/DEBIAN/control << EOF
          Package: grub-settings
          Version: ${{ steps.version.outputs.VERSION }}
          Section: admin
          Priority: optional
          Architecture: all
          Depends: python3 (>= 3.8), python3-gi, gir1.2-gtk-4.0, gir1.2-adw-1, libgtk-4-1, libadwaita-1-0
          Maintainer: Taylan <taylansoylu@gmail.com>
          Homepage: https://github.com/bingoweb/grub-settings
          Description: Modern GRUB bootloader configuration tool
           GRUB Settings is a GTK4/Libadwaita application that provides
           a user-friendly graphical interface for configuring GRUB
           bootloader settings on Linux systems.
          EOF
      
      - name: Create postinst script
        run: |
          cat > packaging/deb/DEBIAN/postinst << 'EOF'
          #!/bin/bash
          set -e
          gtk-update-icon-cache -f /usr/share/icons/hicolor/ 2>/dev/null || true
          update-desktop-database /usr/share/applications/ 2>/dev/null || true
          echo "GRUB Settings installed successfully!"
          EOF
          chmod 755 packaging/deb/DEBIAN/postinst
      
      - name: Copy application files
        run: |
          # Create launcher
          cat > packaging/deb/usr/bin/grub-settings << 'EOF'
          #!/bin/bash
          python3 /usr/share/grub-settings/grub_settings.py "$@"
          EOF
          chmod 755 packaging/deb/usr/bin/grub-settings
          
          # Copy app files
          cp grub_settings.py packaging/deb/usr/share/grub-settings/
          cp -r assets packaging/deb/usr/share/grub-settings/
          cp -r locales packaging/deb/usr/share/grub-settings/
          
          # Copy desktop and metainfo
          cp flatpak/io.github.taylan.grubsettings.desktop packaging/deb/usr/share/applications/grub-settings.desktop
          cp flatpak/io.github.taylan.grubsettings.metainfo.xml packaging/deb/usr/share/metainfo/
          
          # Copy icon
          cp assets/icon.png packaging/deb/usr/share/icons/hicolor/256x256/apps/grub-settings.png
      
      - name: Build .deb package
        run: |
          dpkg-deb --build packaging/deb packaging/grub-settings_${{ steps.version.outputs.VERSION }}_all.deb
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packaging/grub-settings_*.deb
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: packaging/grub-settings_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-rpm:
    name: Build Fedora/RHEL Package
    runs-on: ubuntu-latest
    container: fedora:latest
    needs: create-release
    
    steps:
      - name: Install build tools
        run: |
          dnf install -y rpm-build git
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION=${VERSION%-*}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create RPM build structure
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          
          # Create tarball for RPM
          mkdir -p grub-settings-${{ steps.version.outputs.VERSION }}
          cp grub_settings.py grub-settings-${{ steps.version.outputs.VERSION }}/
          cp -r assets grub-settings-${{ steps.version.outputs.VERSION }}/
          cp -r locales grub-settings-${{ steps.version.outputs.VERSION }}/
          cp -r flatpak grub-settings-${{ steps.version.outputs.VERSION }}/
          tar czf ~/rpmbuild/SOURCES/grub-settings-${{ steps.version.outputs.VERSION }}.tar.gz grub-settings-${{ steps.version.outputs.VERSION }}
      
      - name: Create spec file
        run: |
          cat > ~/rpmbuild/SPECS/grub-settings.spec << 'EOF'
          Name:           grub-settings
          Version:        ${{ steps.version.outputs.VERSION }}
          Release:        1%{?dist}
          Summary:        Modern GRUB bootloader configuration tool
          License:        GPL-3.0
          URL:            https://github.com/bingoweb/grub-settings
          Source0:        %{name}-%{version}.tar.gz
          BuildArch:      noarch
          
          Requires:       python3 >= 3.8
          Requires:       python3-gobject
          Requires:       gtk4
          Requires:       libadwaita
          
          %description
          GRUB Settings is a GTK4/Libadwaita application that provides
          a user-friendly graphical interface for configuring GRUB
          bootloader settings on Linux systems.
          
          %prep
          %setup -q
          
          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/usr/share/grub-settings
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/metainfo
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          
          # Install main app
          cp grub_settings.py %{buildroot}/usr/share/grub-settings/
          cp -r assets %{buildroot}/usr/share/grub-settings/
          cp -r locales %{buildroot}/usr/share/grub-settings/
          
          # Create launcher
          cat > %{buildroot}/usr/bin/grub-settings << 'LAUNCHER'
          #!/bin/bash
          python3 /usr/share/grub-settings/grub_settings.py "$@"
          LAUNCHER
          chmod 755 %{buildroot}/usr/bin/grub-settings
          
          # Desktop and metadata
          cp flatpak/io.github.taylan.grubsettings.desktop %{buildroot}/usr/share/applications/grub-settings.desktop
          cp flatpak/io.github.taylan.grubsettings.metainfo.xml %{buildroot}/usr/share/metainfo/
          cp assets/icon.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/grub-settings.png
          
          %files
          /usr/bin/grub-settings
          /usr/share/grub-settings/
          /usr/share/applications/grub-settings.desktop
          /usr/share/metainfo/io.github.taylan.grubsettings.metainfo.xml
          /usr/share/icons/hicolor/256x256/apps/grub-settings.png
          
          %changelog
          * $(date '+%a %b %d %Y') Taylan Soylu <taylansoylu@gmail.com> - ${{ steps.version.outputs.VERSION }}-1
          - Initial RPM release
          EOF
      
      - name: Build RPM
        run: |
          rpmbuild -bb ~/rpmbuild/SPECS/grub-settings.spec
          cp ~/rpmbuild/RPMS/noarch/*.rpm ./grub-settings-${{ steps.version.outputs.VERSION }}.noarch.rpm
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: grub-settings-*.rpm
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: grub-settings-*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-arch:
    name: Build Arch Linux Package
    runs-on: ubuntu-latest
    container: archlinux:latest
    needs: create-release
    
    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm base-devel git
          # Create non-root user for makepkg
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION=${VERSION%-*}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create PKGBUILD
        run: |
          mkdir -p archpkg
          cat > archpkg/PKGBUILD << 'EOF'
          pkgname=grub-settings
          pkgver=${{ steps.version.outputs.VERSION }}
          pkgrel=1
          pkgdesc="Modern GRUB bootloader configuration tool"
          arch=('any')
          url="https://github.com/bingoweb/grub-settings"
          license=('GPL3')
          depends=('python' 'python-gobject' 'gtk4' 'libadwaita')
          source=()
          
          package() {
              cd "$srcdir/.."
              
              install -Dm755 /dev/stdin "$pkgdir/usr/bin/grub-settings" << 'LAUNCHER'
          #!/bin/bash
          python3 /usr/share/grub-settings/grub_settings.py "$@"
          LAUNCHER
              
              install -Dm644 ../grub_settings.py "$pkgdir/usr/share/grub-settings/grub_settings.py"
              cp -r ../assets "$pkgdir/usr/share/grub-settings/"
              cp -r ../locales "$pkgdir/usr/share/grub-settings/"
              
              install -Dm644 ../flatpak/io.github.taylan.grubsettings.desktop "$pkgdir/usr/share/applications/grub-settings.desktop"
              install -Dm644 ../flatpak/io.github.taylan.grubsettings.metainfo.xml "$pkgdir/usr/share/metainfo/io.github.taylan.grubsettings.metainfo.xml"
              install -Dm644 ../assets/icon.png "$pkgdir/usr/share/icons/hicolor/256x256/apps/grub-settings.png"
          }
          EOF
          
          chown -R builder:builder archpkg
          chown -R builder:builder .
      
      - name: Build package
        run: |
          cd archpkg
          su builder -c "makepkg -sf --noconfirm"
          cp *.pkg.tar.zst ../grub-settings-${{ steps.version.outputs.VERSION }}-arch.pkg.tar.zst || true
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: grub-settings-*-arch.pkg.tar.zst
        continue-on-error: true
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: grub-settings-*-arch.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  create-source:
    name: Create Source Archive
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix=grub-settings-${{ steps.version.outputs.VERSION }}/ -o grub-settings-${{ steps.version.outputs.VERSION }}-source.tar.gz HEAD
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: grub-settings-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
