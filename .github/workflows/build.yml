name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION=${VERSION%-*}  # Remove -beta suffix if present
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Create package structure
        run: |
          mkdir -p packaging/deb/DEBIAN
          mkdir -p packaging/deb/usr/bin
          mkdir -p packaging/deb/usr/share/grub-settings
          mkdir -p packaging/deb/usr/share/applications
          mkdir -p packaging/deb/usr/share/metainfo
          mkdir -p packaging/deb/usr/share/icons/hicolor/256x256/apps
      
      - name: Create control file
        run: |
          cat > packaging/deb/DEBIAN/control << EOF
          Package: grub-settings
          Version: ${{ steps.version.outputs.VERSION }}
          Section: admin
          Priority: optional
          Architecture: all
          Depends: python3 (>= 3.8), python3-gi, gir1.2-gtk-4.0, gir1.2-adw-1, libgtk-4-1, libadwaita-1-0
          Maintainer: Taylan <taylansoylu@gmail.com>
          Homepage: https://github.com/bingoweb/grub-settings
          Description: Modern GRUB bootloader configuration tool
           GRUB Settings is a GTK4/Libadwaita application that provides
           a user-friendly graphical interface for configuring GRUB
           bootloader settings on Linux systems.
          EOF
      
      - name: Create postinst script
        run: |
          cat > packaging/deb/DEBIAN/postinst << 'EOF'
          #!/bin/bash
          set -e
          gtk-update-icon-cache -f /usr/share/icons/hicolor/ 2>/dev/null || true
          update-desktop-database /usr/share/applications/ 2>/dev/null || true
          echo "GRUB Settings installed successfully!"
          EOF
          chmod 755 packaging/deb/DEBIAN/postinst
      
      - name: Copy application files
        run: |
          # Create launcher
          cat > packaging/deb/usr/bin/grub-settings << 'EOF'
          #!/bin/bash
          python3 /usr/share/grub-settings/grub_settings.py "$@"
          EOF
          chmod 755 packaging/deb/usr/bin/grub-settings
          
          # Copy app files
          cp grub_settings.py packaging/deb/usr/share/grub-settings/
          cp -r assets packaging/deb/usr/share/grub-settings/
          cp -r locales packaging/deb/usr/share/grub-settings/
          
          # Copy desktop and metainfo
          cp flatpak/io.github.taylan.grubsettings.desktop packaging/deb/usr/share/applications/grub-settings.desktop
          cp flatpak/io.github.taylan.grubsettings.metainfo.xml packaging/deb/usr/share/metainfo/
          
          # Copy icon
          cp assets/icon.png packaging/deb/usr/share/icons/hicolor/256x256/apps/grub-settings.png
      
      - name: Build .deb package
        run: |
          dpkg-deb --build packaging/deb packaging/grub-settings_${{ steps.version.outputs.VERSION }}_all.deb
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: packaging/grub-settings_*.deb
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: packaging/grub-settings_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-source:
    name: Create Source Archive
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix=grub-settings-${{ steps.version.outputs.VERSION }}/ -o grub-settings-${{ steps.version.outputs.VERSION }}-source.tar.gz HEAD
      
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: grub-settings-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
